<style>
:root{--bg:#0d0b0a;--card:#181412;--card2:#201a17;--line:#33291f;--tx:#f6efe7;--mut:#a89a8a;--a1:#ffb84d;--a2:#ff5f6d;--ok:#5ee6a8;--g:linear-gradient(135deg,#ffb84d,#ff5f6d)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Bengali",Arial,sans-serif;background:radial-gradient(420px 320px at 100% 0,rgba(255,95,109,.18),transparent),radial-gradient(420px 320px at 0 100%,rgba(255,184,77,.12),transparent),var(--bg)}
.app{max-width:620px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:50px;height:50px;border-radius:16px;background:var(--g);display:grid;place-items:center;box-shadow:0 8px 24px rgba(255,95,109,.35),inset 0 1px 0 rgba(255,255,255,.4);user-select:none}
.logo svg{width:28px;height:28px}
.brand{flex:1}.brand b{font-family:Georgia,"Times New Roman",serif;font-size:24px;letter-spacing:1px}.brand small{display:block;color:var(--mut);letter-spacing:3px;font-size:9.5px;margin-top:2px}
.pill{color:var(--a1);background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.35);border-radius:20px;padding:6px 11px;font-size:11.5px;font-weight:600}
.cd{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 12px 30px rgba(0,0,0,.35)}.c{text-align:center}
h2{font-family:Georgia,serif;font-size:24px;margin:10px 0 6px;font-weight:700}h3{margin:0 0 8px;font-size:16px}p{color:var(--mut);line-height:1.6;margin:5px 0;font-size:14px}
.big{width:84px;height:84px;margin:4px auto 10px;border-radius:26px;background:var(--g);display:grid;place-items:center;font-size:36px;box-shadow:0 10px 30px rgba(255,95,109,.35)}
.rg{position:relative;width:110px;height:110px;margin:2px auto 8px}.rg svg{width:100%;height:100%;transform:rotate(-90deg)}.rg b{position:absolute;inset:0;display:grid;place-items:center;font-family:Georgia,serif;font-size:30px}.rg b small{font-size:14px;color:var(--mut)}
.rg circle{transition:stroke-dashoffset .7s ease}
.vs{position:relative;display:flex;align-items:center;gap:13px;padding:13px;border-radius:16px;border:1px solid var(--line);margin-top:10px;background:var(--card)}
.vs.cur{border-color:var(--a1);background:linear-gradient(90deg,rgba(255,184,77,.12),transparent)}.vs.lk{opacity:.45}
.ci{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:var(--card2);border:1px solid var(--line);flex:none}
.vs.cur .ci{background:var(--g);border:0;color:#2a1305}.vs.dn .ci{background:var(--ok);border:0;color:#052a1a;animation:pop .4s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}}
.vs .t{flex:1;min-width:0}.vs b{display:block;font-size:15px}.vs small{color:var(--mut);font-size:12.5px}
button{cursor:pointer;border:0;color:var(--tx);font-family:inherit;font-weight:700}
.btn{width:100%;border-radius:16px;padding:16px;font-size:16px;color:#2a1305;background:var(--g);box-shadow:0 10px 26px rgba(255,95,109,.35);margin-top:14px;letter-spacing:.3px}
.btn:active,.sm:active{transform:scale(.97)}button:disabled{opacity:.55;cursor:wait}
.sm{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:9px 13px;font-size:13px}.sm.s{background:var(--g);color:#2a1305;border:0}.sm.r{background:#7a2230;border:0}
.sp{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sn .8s linear infinite;vertical-align:-3px;margin-right:6px}@keyframes sn{to{transform:rotate(360deg)}}
.fi{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:8px 0 4px}.ico{width:92px;height:92px;border-radius:28px;background:var(--g);display:grid;place-items:center;font-size:42px;box-shadow:0 12px 30px rgba(255,95,109,.35)}
.fi b{display:block;word-break:break-word;font-family:Georgia,serif;font-size:21px}.fi small{color:var(--mut)}
.chips{display:flex;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap}.chips i{font-style:normal;font-size:12px;color:var(--a1);background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.25);padding:4px 10px;border-radius:20px}
.notice{display:block;background:rgba(255,184,77,.07);border:1px dashed rgba(255,184,77,.45);padding:13px 15px;border-radius:16px;margin-top:16px;font-size:13.5px;color:var(--tx);white-space:pre-wrap;line-height:1.6;text-align:left}.notice b{color:var(--a1);display:block;margin-bottom:4px;font-size:12px;letter-spacing:2px}
input,textarea{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:#100d0b;color:var(--tx);font-size:15px;margin:5px 0 9px;font-family:inherit}input:focus,textarea:focus{outline:0;border-color:var(--a1)}
label{display:block;font-size:12.5px;color:var(--mut);margin-top:6px}
.pick{position:relative;display:block;text-align:center;padding:20px;border:2px dashed rgba(255,184,77,.5);border-radius:18px;background:rgba(255,184,77,.05);color:var(--a1);font-weight:700;margin:8px 0;word-break:break-all}
.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}.pick.sel{border-style:solid;border-color:var(--ok);color:var(--ok)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:0;background:var(--g);transition:width .2s}
.it{padding:13px 0;border-top:1px solid var(--line)}.it:first-child{border:0}.it .bt{display:flex;gap:6px;margin-top:8px}.it .bt button{flex:1}
.err{color:#ff7a85;font-size:13.5px;font-weight:700;margin-top:10px}
.vbox{position:relative;width:170px;height:170px;margin:14px auto 16px}.vbox svg{position:absolute;inset:0;width:100%;height:100%}
.glow{position:absolute;inset:-22px;border-radius:50%;background:radial-gradient(circle,rgba(94,230,168,.3),transparent 65%);animation:pu2 2s infinite}@keyframes pu2{50%{transform:scale(1.15);opacity:.6}}
.spinarc{transform-box:view-box;transform-origin:center;animation:sn .6s linear 2,fo .2s 1.2s forwards}@keyframes fo{to{opacity:0}}
.ringc{stroke-dasharray:440;stroke-dashoffset:440;animation:dr .9s .5s ease forwards}.tickp{stroke-dasharray:90;stroke-dashoffset:90;animation:dr .5s 1.3s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.vword{font-family:Georgia,serif;font-size:34px;font-weight:700;letter-spacing:7px;text-align:center;background:linear-gradient(90deg,#ffb84d,#5ee6a8);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:wd 1s 1.4s ease forwards}
@keyframes wd{from{opacity:0;letter-spacing:22px;transform:scale(.8)}to{opacity:1;letter-spacing:7px;transform:scale(1)}}
.vsub{opacity:0;animation:wd2 .8s 2s forwards}@keyframes wd2{to{opacity:1}}
.fade{animation:fd .4s}@keyframes fd{from{opacity:0;transform:translateY(10px)}}
.footer{text-align:center;color:#6d6155;font-size:10px;letter-spacing:3px;margin:26px 0 6px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,40px);background:#2a211b;border:1px solid var(--line);padding:11px 18px;border-radius:30px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}

select{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:#100d0b;color:var(--tx);font-size:15px;margin:5px 0 9px;font-family:inherit}
input[type=color]{height:48px;padding:4px;cursor:pointer}
.bn{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:22px;scrollbar-width:none;box-shadow:0 12px 30px rgba(0,0,0,.4)}.bn::-webkit-scrollbar{display:none}
.bs{flex:0 0 100%;scroll-snap-align:start;min-height:158px;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:18px;cursor:pointer}
.bs b{font-family:Georgia,serif;font-size:22px;display:block;text-shadow:0 2px 10px rgba(0,0,0,.6)}.bs p{color:#fff;opacity:.9;font-size:13px;margin:4px 0;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.go{display:inline-block;margin-top:6px;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700}
.bd{display:flex;justify-content:center;gap:6px;margin:10px 0 0}.bd i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.3s}.bd i.on{width:22px;border-radius:5px;background:var(--a1)}
.pm{padding:0!important;overflow:hidden}.pm .tp{background:#100d0b;padding:22px 16px 16px;text-align:center;border-bottom:1px solid var(--line)}.pm .bt2{padding:20px 18px 18px;text-align:center}
.pm .nm{font-family:Georgia,serif;font-size:21px;font-weight:700;margin-top:12px;letter-spacing:.5px}.pm .sb{color:var(--mut);font-style:italic;font-size:13px;margin-top:2px}
.pm h2{margin:0 0 8px}.pm .ds{white-space:pre-wrap;color:#cdbfae;font-size:14.5px;line-height:1.7}
.mw{overflow:hidden;margin:0 auto;border:2px solid rgba(255,184,77,.35);background:#000}.mw.ph{background:var(--g);display:grid;place-items:center;font-size:44px;border:0}
.cv{display:block;width:100%;max-height:230px;object-fit:cover;border-radius:18px;margin-bottom:14px}
.mi{display:flex;align-items:center;gap:14px;padding:15px;border-radius:18px;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);margin-top:10px;cursor:pointer;transition:.15s}
.mi:active{transform:scale(.97);border-color:var(--a1)}.mic{width:46px;height:46px;border-radius:14px;background:var(--g);display:grid;place-items:center;font-size:22px;flex:none}
.mi b{display:block}.mi small{color:var(--mut)}.mi .ar{margin-left:auto;color:var(--a1);font-size:24px}
.bk{display:flex;align-items:center;gap:12px;margin-bottom:6px}.bk b{font-size:18px;font-family:Georgia,serif}
.sl{animation:sl .3s}@keyframes sl{from{opacity:0;transform:translateX(26px)}}
.pick{transition:transform .15s}.pick.rp{animation:rp .55s}.pick.rp::first-line{color:#fff}
@keyframes rp{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,184,77,.65)}35%{transform:scale(.94)}100%{transform:scale(1);box-shadow:0 0 0 26px rgba(255,184,77,0)}}
</style></head>
<body><div class="app" id="app"></div><div id="toast"></div>
<script>
"use strict";
/* ============ সেটিংস (এখানে বদলান) ============ */
const ADMIN_PASSWORD="123456";           // অ্যাডমিন পাসওয়ার্ড — অবশ্যই বদলান
const VERIFY_STEPS=3;                    // ভেরিফাই ধাপ
const ZONE="YOUR_ZONE_ID";               // Monetag Zone ID (উপরের script এও একই দিন)
const BOT_LINK="";                       // উদা: "https://t.me/YourBot/app" — দিলে লিংক হবে BOT_LINK?startapp=ID
const APP_NAME="Vaultly";
const FIREBASE_CONFIG=null;              // চাইলে firebaseConfig অবজেক্ট এখানে বসান: {apiKey:"...",projectId:"...",storageBucket:"..."}
/* =============================================== */
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor("#0d0b0a");tg.setBackgroundColor("#0d0b0a")}catch(e){}}
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.className="on";clearTimeout(toast.h);toast.h=setTimeout(()=>t.className="",2600)};
const DS={bnH:140,adz:[],pwh:"",bot:{token:"",chat:""},adLink:1,t:{vh:"Verify to Continue",vs:"Complete 3 quick steps to continue.",s1t:"Human Check",s1d:"Confirm that you are not a robot",s2t:"Device Check",s2d:"Making sure your device is safe",s3t:"Account Confirmation",s3d:"Final step — almost done!",vb:"Verify",vn:"Each step requires watching a short ad",okw:"VERIFIED",oks:"Verification successful! Please wait...",ul:"Unlock File",dl:"Download File",nt:"NOTICE",ft:"Vaultly · 2026"},ads:{code:"",src:"",zone:"",sdk:""},title:"Vaultly",sub:"PRIVATE · FAST · SAFE",banners:[{title:"Join our channel",desc:"Updates every day",link:"",img:""},{title:"New files are here!",desc:"Get the best content right here",link:"",img:""}],promo:{media:{},name:"My Channel",sub:"public channel",title:"File Link Required",desc:"Join our channel and tap any file link there to open it.",btn:"Join Channel",link:"",color:"#ff7a3d"}};
let S=DS;const mergeS=d=>({...DS,...d,adz:Array.isArray(d.adz)?d.adz:(d.ads&&d.ads.zone?[d.ads]:[]),bot:{...DS.bot,...(d.bot||{})},t:{...DS.t,...(d.t||{})},adLink:d.adLink==null?1:d.adLink,ads:{...DS.ads,...(d.ads||{})},banners:d.banners||DS.banners,promo:{...DS.promo,...(d.promo||{}),media:{...((d.promo&&d.promo.media)||{})}}});
const T=()=>S.t;
document.addEventListener("click",e=>{const p=e.target.closest&&e.target.closest(".pick");if(p){p.classList.remove("rp");void p.offsetWidth;p.classList.add("rp")}},true);
const SES={n:0,ok:false,admin:false,unl:{}};let taps=0,FB={db:null,st:null,cfg:null},CFG=FIREBASE_CONFIG;
const fmt=b=>b<1024?b+" B":b<1048576?(b/1024).toFixed(1)+" KB":b<1073741824?(b/1048576).toFixed(1)+" MB":(b/1073741824).toFixed(2)+" GB";
const ICONS={pdf:"📕",zip:"🗜️",rar:"🗜️","7z":"🗜️",apk:"🤖",mp4:"🎬",mkv:"🎬",mov:"🎬",mp3:"🎵",wav:"🎵",jpg:"🖼️",jpeg:"🖼️",png:"🖼️",gif:"🖼️",doc:"📝",docx:"📝",txt:"📄",xls:"📊",xlsx:"📊",ppt:"📽️",pptx:"📽️"};
const icon=n=>ICONS[(String(n).split(".").pop()||"").toLowerCase()]||"📁";
const b64e=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");s+="=".repeat((4-s.length%4)%4);return JSON.parse(decodeURIComponent(escape(atob(s))))};
const Q=new URLSearchParams(location.search);
const fileId=()=>(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||Q.get("file")||Q.get("tgWebAppStartParam")||"";
/* ---- Firebase ---- */
const loadScript=u=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=u;s.onload=res;s.onerror=()=>rej(new Error("Firebase লোড হয়নি — নেটওয়ার্ক দেখুন"));document.head.appendChild(s)});
async function fbInit(){
  if(FB.db)return true;
  if(!CFG){try{if(Q.get("fb"))CFG=b64d(Q.get("fb"));else CFG=JSON.parse(localStorage.getItem("fv_cfg")||"null")}catch(e){}}
  if(!CFG)return false;
  if(!window.firebase){const B="https://www.gstatic.com/firebasejs/10.12.2/";await loadScript(B+"firebase-app-compat.js");await loadScript(B+"firebase-firestore-compat.js")}
  firebase.initializeApp(CFG);FB.db=firebase.firestore();FB.st=null;return true;
}
/* ---- Layout ---- */
function shell(h,pill="● ONLINE"){app.innerHTML=`<header class="top"><div class="logo" onclick="logoTap()"><svg viewBox="0 0 24 24" fill="none" stroke="#2a1305" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v5c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6z"/><path d="M12 9v4M10 13h4"/></svg></div><div class="brand"><b>${esc(S.title)}</b><small>${esc(S.sub)}</small></div><div class="pill">${pill}</div></header><div class="fade">${h}</div><div class="footer">${esc(T().ft)}</div>`}
function logoTap(){if(++taps>=5){taps=0;location.hash="#admin"}clearTimeout(logoTap.h);logoTap.h=setTimeout(()=>taps=0,1500)}
window.addEventListener("hashchange",init);
/* ---- Ads (Monetag) ---- */
let adIdx=0;
const curZones=()=>S.adz&&S.adz.length?S.adz:(S.ads&&S.ads.zone?[S.ads]:[]);
async function runAd(){
  try{
    const z=curZones(),a=z.length?z[adIdx++%z.length]:null,fn=(a&&a.sdk)||"show_"+ZONE;
    for(let k=0;k<20&&typeof window[fn]!=="function"&&(a||(tg&&tg.initData));k++)await new Promise(r=>setTimeout(r,150));
    const f=window[fn];
    if(typeof f==="function"){const r=await f();if(r&&r.reward_event_type==="not_valued")throw new Error("Ad was not completed. Please try again.");return true}
    if(!(tg&&tg.initData)){await new Promise(r=>setTimeout(r,2500));return true} // শুধু ব্রাউজার টেস্ট
    throw new Error("Ad failed to load. Check internet or disable ad blocker.");
  }catch(e){toast(e.message||"Could not start the ad");return false}
}
function parseAds(c){c=(c||"").trim();const o={code:c,src:"",zone:"",sdk:""};if(!c)return o;
  if(/^\d+$/.test(c)){o.zone=c;o.sdk="show_"+c;o.src="https://libtl.com/sdk.js";return o}
  const g=r=>{const m=c.match(r);return m?m[1]:""};
  o.src=g(/src\s*=\s*['"]?([^'"\s>]+)/i);o.zone=g(/data-zone\s*=\s*['"]?([\w-]+)/i);o.sdk=g(/data-sdk\s*=\s*['"]?([\w$]+)/i);
  if(o.src.startsWith("//"))o.src="https:"+o.src;if(!o.sdk&&o.zone)o.sdk="show_"+o.zone;return o}
function injectAds(){const z=curZones();if(!z.length)return;document.querySelectorAll("script[data-mt]").forEach(e=>e.remove());const old=document.getElementById("monetag-sdk");if(old)old.remove();
  z.forEach(a=>{if(!a.src||!a.zone)return;const e=document.createElement("script");e.setAttribute("data-mt","1");e.src=a.src;e.async=true;e.dataset.zone=a.zone;e.dataset.sdk=a.sdk;document.head.appendChild(e)})}

/* ---- Verify ---- */
const STEPS=[["Human Check","Confirm that you are not a robot"],["Device Check","Making sure your device is safe"],["Account Confirmation","Final step — almost done!"]];
function verifyScreen(){
  const n=SES.n;
  let h=`<div class="cd c" style="margin-top:0"><div class="rg"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#33291f" stroke-width="7"/><circle cx="50" cy="50" r="44" fill="none" stroke="url(#gg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="${276.5*(1-n/VERIFY_STEPS)}"/><defs><linearGradient id="gg"><stop offset="0" stop-color="#ffb84d"/><stop offset="1" stop-color="#ff5f6d"/></linearGradient></defs></svg><b>${n}<small>/${VERIFY_STEPS}</small></b></div><h2>${esc(T().vh)}</h2><p>${esc(T().vs)}</p></div><div class="cd" style="padding-top:6px">`;
  for(let i=0;i<VERIFY_STEPS;i++){const st=i<n?"dn":i===n?"cur":"lk",s=[T()["s"+(i%3+1)+"t"],T()["s"+(i%3+1)+"d"]];
    h+=`<div class="vs ${st}"><div class="ci">${st==="dn"?"✓":i+1}</div><div class="t"><b>${s[0]}</b><small>${st==="dn"?"Completed":s[1]}</small></div>${st==="cur"?`<button class="sm s" onclick="doVerify(this)">${esc(T().vb)}</button>`:st==="lk"?"🔒":""}</div>`}
  shell(h+`</div><p class="c" style="font-size:12px;margin-top:12px">${esc(T().vn)}</p>`,"🔒 Secure");
}
async function doVerify(b){
  b.disabled=true;b.innerHTML='<span class="sp"></span>Wait';
  if(await runAd()){SES.n++;toast("✔ Step "+SES.n+" complete");if(SES.n>=VERIFY_STEPS){SES.ok=true;verifiedPage();return setTimeout(init,3600)}}
  verifyScreen();
}
function verifiedPage(){
  shell(`<div class="cd c"><div class="vbox"><div class="glow"></div><svg viewBox="0 0 170 170"><circle class="spinarc" cx="85" cy="85" r="70" fill="none" stroke="#ffb84d" stroke-width="5" stroke-dasharray="90 350" stroke-linecap="round"/><circle class="ringc" cx="85" cy="85" r="70" fill="none" stroke="#5ee6a8" stroke-width="6" stroke-linecap="round" transform="rotate(-90 85 85)"/><path class="tickp" d="M55 88l22 22 40-46" fill="none" stroke="#5ee6a8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="vword">${esc(T().okw)}</div><p class="vsub">${esc(T().oks)}</p></div>`,"✔ Verified");
}
/* ---- File page ---- */
let FILE=null;
async function fileScreen(){
  const id=fileId();

async function tgCall(m,p){const fd=new FormData();for(const k in p)fd.append(k,p[k]);const r=await fetch(`https://api.telegram.org/bot${S.bot.token}/${m}`,{method:"POST",body:fd}),j=await r.json();if(!j.ok)throw new Error(j.description||"Telegram error");return j.result}

function tgUpload(file,onp){return new Promise((res,rej)=>{const fd=new FormData();fd.append("chat_id",S.bot.chat);fd.append("document",file,file.name);fd.append("caption",file.name);
  const x=new XMLHttpRequest();x.open("POST",`https://api.telegram.org/bot${S.bot.token}/sendDocument`);
  x.upload.onprogress=e=>{if(e.lengthComputable&&onp)onp(Math.round(e.loaded/e.total*100))};
  x.onload=()=>{try{const j=JSON.parse(x.responseText);if(!j.ok)throw new Error(j.description);const d=j.result.document||j.result.video||j.result.audio||{};res({fid:d.file_id,mid:j.result.message_id})}catch(e){rej(e)}};
  x.onerror=()=>rej(new Error("নেটওয়ার্ক ত্রুটি"));x.send(fd)})}
function shrink(f,max,lim){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);
    let q=.8,d=c.toDataURL("image/jpeg",q);while(d.length>(lim||200000)&&q>.3){q-=.1;d=c.toDataURL("image/jpeg",q)}URL.revokeObjectURL(u);res(d)};
  im.onerror=()=>rej(new Error("ছবি পড়া যায়নি"));im.src=u})}

async function adminGo(pg){

async function saveAdz(b){const out=[];for(const a of ADZ){const c=(a.code||"").trim();if(!c)continue;const o=parseAds(c);if(!o.zone)return toast("একটা কোড থেকে Zone ID পাওয়া যায়নি");out.push(o)}
  const n=Math.max(0,Math.min(5,parseInt($("#adl").value)||0));b.disabled=true;
  try{await FB.db.collection("settings").doc("app").set({adz:out,ads:out[0]||{code:"",src:"",zone:"",sdk:""},adLink:n},{merge:true});S.adz=out;S.ads=out[0]||DS.ads;S.adLink=n;injectAds();toast("✔ সেভ হয়েছে")}catch(e){toast("সেভ ব্যর্থ — Firestore Rules দেখুন")}
  b.disabled=false;adminGo("ads")}
/* ---- ছবি ক্রপ ---- */
function cropImage(file,asp,o){o=o||{};return new Promise(res=>{
  const u=URL.createObjectURL(file),im=new Image();
  im.onerror=()=>{toast("ছবি পড়া যায়নি");res(null)};
  im.onload=()=>{
    let fw=Math.min(innerWidth-32,420),fh=fw/asp;if(fh>innerHeight*.5){fh=innerHeight*.5;fw=fh*asp}
    const base=Math.max(fw/im.width,fh/im.height);let z=1,ox=(fw-im.width*base)/2,oy=(fh-im.height*base)/2;
    const m=document.createElement("div");m.style.cssText="position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;color:#fff";
    m.innerHTML=`<b>ছবি ক্রপ করুন — টেনে সরান, স্লাইডারে জুম</b><div id="cf_" style="width:${fw}px;height:${fh}px;overflow:hidden;position:relative;border-radius:14px;border:2px solid #ffb84d;touch-action:none;background:#000"><img id="ci_" alt="" style="position:absolute;left:0;top:0;max-width:none;user-select:none;-webkit-user-drag:none"></div><input id="cz_" type="range" min="100" max="400" value="100" style="width:${fw}px"><div style="display:flex;gap:10px;width:${fw}px"><button class="sm" style="flex:1" id="cx_">✖ বাতিল</button><button class="btn" style="flex:2;margin:0;padding:12px" id="cs_">✔ ক্রপ করুন</button></div>`;
    document.body.appendChild(m);
    const el=m.querySelector("#ci_"),fr=m.querySelector("#cf_");el.src=u;
    const draw=()=>{const s=base*z,w=im.width*s,h=im.height*s;ox=Math.min(0,Math.max(fw-w,ox));oy=Math.min(0,Math.max(fh-h,oy));el.style.width=w+"px";el.style.height=h+"px";el.style.left=ox+"px";el.style.top=oy+"px"};draw();
    let px=0,py=0,drag=false;
    fr.onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY;fr.setPointerCapture(e.pointerId)};
    fr.onpointermove=e=>{if(!drag)return;ox+=e.clientX-px;oy+=e.clientY-py;px=e.clientX;py=e.clientY;draw()};
    fr.onpointerup=fr.onpointercancel=()=>{drag=false};
    m.querySelector("#cz_").oninput=e=>{const cx=(fw/2-ox)/(base*z),cy=(fh/2-oy)/(base*z);z=e.target.value/100;ox=fw/2-cx*base*z;oy=fh/2-cy*base*z;draw()};
    const close=v=>{m.remove();URL.revokeObjectURL(u);res(v)};
    m.querySelector("#cx_").onclick=()=>close(null);
    m.querySelector("#cs_").onclick=()=>{const s=base*z,sw=fw/s,sh=fh/s,ow=Math.min(o.max||900,Math.round(sw)),oh=Math.round(ow/asp),c=document.createElement("canvas");c.width=ow;c.height=oh;
      c.getContext("2d").drawImage(im,-ox/s,-oy/s,sw,sh,0,0,ow,oh);let q=.85,d=c.toDataURL("image/jpeg",q);while(d.length>(o.lim||200000)&&q>.3){q-=.1;d=c.toDataURL("image/jpeg",q)}close(d)};
  };im.src=u})}
/* ---- Init ---- */
async function loadS(){try{if(await fbInit()){const d=await FB.db.collection("settings").doc("app").get();if(d.exists)S=mergeS(d.data());const m=S.promo&&S.promo.media;if(m&&/^tg:/.test(m.url||"")){try{m.src=await tgUrl(m.url.slice(3))}catch(e){}}}}catch(e){}}
async function init(){
  if(!init.l){init.l=1;await loadS();injectAds()}
  if(location.hash==="#admin")return SES.admin?adminPanel():adminLogin();
  if(!SES.ok)return verifyScreen();
  if(!fileId())return homeScreen();
  fileScreen();
}
init();
